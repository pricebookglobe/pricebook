<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs><linearGradient id="pbTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FD9C5"/>
      <stop offset="100%" stop-color="#0E8C85"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="258" cy="240" r="64.5"/></clipPath>
  </defs>

  <!-- Shield: flat navy outline, white interior, no bevel highlight or
       drop shadow baked in, so it never haloes against a dark background. -->
  <path d="M40,98 L140,24 L200,76 L260,24 L360,98
           L354,232 Q348,344 200,452
           Q52,344 46,232 Z"
        fill="#FFFFFF" stroke="#16223F" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Price tag: the thing being tracked -->
  <g transform="translate(78,165) rotate(-16 95.0 65.0)">
    <path d="M0,65.0 L55,0 L172,0 Q190,0 190,18 L190,112 Q190,130 172,130 L55,130 Z" fill="url(#pbTeal)" stroke="#16223F" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="30.250000000000004" cy="65.0" r="11" fill="#FFFFFF" stroke="#16223F" stroke-width="7"/>
  </g>

  <!-- Magnifying glass over the tag: searching/comparing the price -->
  <g clip-path="url(#lensClip)">
    <rect x="186" y="168" width="144" height="144" fill="#FFFFFF"/>
  </g>
  <path d="M306.0832611206852,288.0832611206852 L347.09545442950497,329.09545442950497" stroke="#16223F" stroke-width="15" stroke-linecap="round"/>
  <circle cx="258" cy="240" r="64.5" fill="none" stroke="#16223F" stroke-width="15"/>

  <!-- Checkmark in the lens: the price, verified -->
  <path d="M228,242 L248,264 L292,214"
        fill="none" stroke="url(#pbTeal)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>