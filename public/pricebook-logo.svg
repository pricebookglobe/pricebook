<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="pbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C98A"/>
      <stop offset="100%" stop-color="#1F8A5F"/>
    </linearGradient>
  </defs>

  <!-- Shield: flat navy outline, white interior, no bevel highlight or
       drop shadow baked in, so it never haloes against a dark background. -->
  <path d="M40,98 L140,24 L200,76 L260,24 L360,98
           L354,232 Q348,344 200,452
           Q52,344 46,232 Z"
        fill="#FFFFFF" stroke="#16223F" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- "P" with a flourish tail curling from the stem, like the original mark -->
  <path d="M112,330
           L112,150
           Q112,138 124,138
           L164,138
           Q204,138 204,176
           Q204,214 164,214
           L148,214
           L148,214
           Q116,214 100,250
           Q92,268 92,296
           Q92,316 104,328
           Q108,332 112,330 Z"
        fill="#16223F"/>
  <!-- cut-out for the bowl's inner counter -->
  <path d="M148,170 L148,182 Q148,182 160,182 Q180,182 180,176 Q180,170 160,170 Z"
        fill="#FFFFFF"/>

  <!-- "B" with an angled flourish cut on its top edge -->
  <path d="M222,138
           L278,138
           Q318,138 318,172
           Q318,196 298,204
           Q322,212 322,240
           Q322,278 278,278
           L222,278 Z"
        fill="url(#pbGreen)"/>
  <path d="M248,160 L248,196 L276,196 Q296,196 296,178 Q296,160 274,160 Z" fill="#FFFFFF"/>
  <path d="M248,220 L248,256 L280,256 Q300,256 300,238 Q300,220 278,220 Z" fill="#FFFFFF"/>

  <!-- cart + sparkle + check glyph -->
  <g transform="translate(118,300)">
    <!-- sparkle -->
    <path d="M118,0 L122,10 L132,14 L122,18 L118,28 L114,18 L104,14 L114,10 Z" fill="#34C98A"/>
    <circle cx="140" cy="8" r="3.5" fill="#34C98A"/>
    <!-- cart -->
    <path d="M2,18 L20,18 L26,13 L52,13 L58,18 L72,18 A4,4 0 0 1 76,22 L76,52
              A4,4 0 0 1 72,56 L8,56 A4,4 0 0 1 4,52 L4,22 A4,4 0 0 1 8,18 Z"
          fill="none" stroke="#16223F" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="20" cy="70" r="6" fill="#16223F"/>
    <circle cx="60" cy="70" r="6" fill="#16223F"/>
    <!-- coin / price tag -->
    <circle cx="26" cy="36" r="10" fill="#FFFFFF" stroke="#34C98A" stroke-width="5"/>
    <!-- check -->
    <path d="M40,38 L58,52 L92,16" fill="none" stroke="#1F8A5F" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
