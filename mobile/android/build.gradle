// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        // com.google.gms:google-services was removed: this app has no
        // google-services.json and never applies the plugin (see
        // app/build.gradle), so the classpath dependency was pure dead
        // weight — Gradle still resolves it and its ~30 transitive
        // dependencies even though nothing uses it, which is exactly what
        // failed to resolve and broke the build.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
