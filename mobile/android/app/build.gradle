apply plugin: 'com.android.application'

// Release signing: reads from keystore.properties (never committed — see
// .gitignore) rather than hardcoding a path/password in this file, which
// would otherwise put the signing key's password in plain text in git
// history forever. keystore.properties.example in this same folder shows
// the format to copy. If keystore.properties isn't present (e.g. a debug
// build on a machine that hasn't been given the release key), the release
// signingConfig block below is simply skipped and `assembleRelease` /
// `bundleRelease` will fail with a clear "keystore not found" error rather
// than silently producing an unsigned build.
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.pricebook.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pricebook.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        // Every debug APK used to be signed with whatever ~/.android/debug.keystore
        // happened to exist on whatever machine built it — fine locally (that file
        // persists), but GitHub Actions starts a brand-new container on every run
        // with no such file, so Android Gradle Plugin silently generated a FRESH,
        // randomly-keyed one each time. That means every CI-built debug APK was
        // signed with a different key than the last, and Android refuses to install
        // an update whose signature doesn't match what's already on the device —
        // so testing a new CI build over an old one could silently fail (or get
        // rejected with an easy-to-miss error), leaving the OLD build running with
        // no visible sign the "fix" was never actually installed. Pointing debug
        // at this committed, fixed-key keystore (debug-only, not sensitive — same
        // reasoning Android's own auto-generated one isn't secret either) makes
        // every debug build, from CI or any machine, share one identical signature,
        // so each new APK can just install right over the last one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    // Required by @capacitor-mlkit/barcode-scanning's ready-to-use scan() UI.
    buildFeatures {
        dataBinding true
    }
    dataBinding {
        enabled = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The google-services plugin (and its classpath dependency in the root
// build.gradle) was removed — this app has no google-services.json and
// doesn't use Firebase/push notifications, so it was only ever dead
// weight that added dependency-resolution risk for no benefit.
