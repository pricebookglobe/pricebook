name: Build signed Android release (AAB)

# Builds the signed .aab PriceBook uploads to Google Play — triggered only
# by hand from the Actions tab (never on push), since every run consumes
# the release signing key via repo secrets and should be a deliberate
# "I want a release build now" action, not something that fires on every
# commit to mobile/.
#
# Needs four repository secrets set first (Settings -> Secrets and
# variables -> Actions -> New repository secret):
#   ANDROID_KEYSTORE_BASE64   - the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD - its store password
#   ANDROID_KEY_ALIAS         - the key alias inside it (e.g. "pricebook")
#   ANDROID_KEY_PASSWORD      - its key password
# See mobile/android/app/keystore.properties.example for what these map to
# locally — this workflow builds the same keystore.properties from secrets
# instead of a checked-in file.
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -e
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile app dependencies
        run: npm install

      - name: Sync the native Android project
        run: npx cap sync android

      # Rebuilds the exact two files a local build reads from
      # mobile/android/app/keystore.properties.example, from secrets
      # instead of a checked-in file — neither the keystore nor its
      # passwords are ever written to the repo or build logs.
      - name: Write the signing key and keystore.properties from secrets
        working-directory: mobile/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          # Fail with a clear, specific message instead of a cryptic
          # downstream Gradle error if any secret was never set (an empty
          # GitHub secret reference silently evaluates to "", it doesn't
          # fail the workflow on its own).
          for name in KEYSTORE_B64 STORE_PW KEY_ALIAS KEY_PW; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is empty or missing. Check Settings > Secrets and variables > Actions on the repo."
              exit 1
            fi
          done

          # -i (ignore-garbage) tolerates stray whitespace/CRLF line endings
          # that copy-pasting the base64 text through different apps/OSes
          # can introduce, which plain `base64 -d` rejects outright.
          echo "$KEYSTORE_B64" | base64 -d -i > pricebook-upload-key.jks

          # Confirm it's actually a valid keystore with this password BEFORE
          # handing it to Gradle, so a bad secret value fails here with a
          # clear message rather than a confusing signing error mid-build.
          if ! keytool -list -keystore pricebook-upload-key.jks -storepass "$STORE_PW" > /dev/null 2>&1; then
            echo "::error::pricebook-upload-key.jks didn't decode into a valid keystore, or ANDROID_KEYSTORE_PASSWORD is wrong. Re-check the ANDROID_KEYSTORE_BASE64 secret was pasted in full with no extra text, and that the password matches README-KEEP-SAFE.txt."
            exit 1
          fi

          cat > keystore.properties <<PROPS
          storeFile=app/pricebook-upload-key.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          PROPS

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build the signed release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove the signing key from the runner's workspace
        if: always()
        working-directory: mobile/android/app
        run: rm -f pricebook-upload-key.jks keystore.properties

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: PriceBook-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
