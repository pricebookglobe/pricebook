name: Build Android test APK

# Builds the PriceBook Android app (a thin wrapper around the live website)
# every time the mobile/ folder changes, and whenever it's triggered by hand
# from the Actions tab. The finished .apk is attached to the run as a
# downloadable file — no Android Studio or local setup needed.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Gradle 8.2 (pinned by this project's wrapper) only runs on JDK up to 17.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install exactly the SDK pieces this project's build.gradle asks for
      # (compileSdk/targetSdk 34), instead of relying on a third-party action
      # that has been flaky about "wrong version" / license prompts.
      - name: Install Android SDK packages
        run: |
          set -e
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install mobile app dependencies
        run: npm install

      - name: Sync the native Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceBook-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
